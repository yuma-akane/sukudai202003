        <title>製程</title>
        <style>
            .center{
                text-align: center;
            }
            .right{
                text-align: right;
            }
            .m_form{
                display: flex;
                flex-direction: column;
                height: 100vh;
            }
            .div1{
                width: 100%;
                flex: 0 0 auto;
            }
            .div1-1{
                display: flex;
                align-items: center;
                gap: 10px;
                border-bottom: 1px solid black;
            }
            .div1-1:first-child{
                background-color: rgb(200,200,200);
            }
            .div1-1:last-child{
                border: none;
            }
            .div1-1:not(:first-child):hover{
                background-color: aquamarine;
            }
            .div-click{
                background-color: aquamarine;
            }
            .div1-1 > div:first-child{
                flex: 1;
                min-width: 32px;
            }
            .div1-1 > div:nth-child(2),
            .div1-1 > div:nth-child(7){
                flex: 2;
                min-width: 80px;
            }
            .div1-1 > div:nth-child(3){
                flex: 5;
                min-width: 220px;
            }
            .div1-1 > div:nth-child(4){
                flex: 3;
                min-width: 95px;
            }
            .div1-1 > div:nth-child(5),
            .div1-1 > div:nth-child(6){
                flex: 4;
                min-width: 110px;
            }
            .div2{
                flex: 1;
                overflow: hidden;
                min-height: 300px;
            }
            .div2 iframe{
                width: 100%;
                height: 100%;
                display: block;
            }
            @media screen and (max-width:800px){
                .div1-1{
                    flex-wrap: wrap;
                }
                .div1-1 > div{
                    flex: none;
                    min-width: none;
                    box-sizing: border-box;
                    text-align: center;
                }
                .div1-1 > div:nth-child(1){
                    flex: 0 0 10%;
                }
                .div1-1 > div:nth-child(2){
                    flex: 0 0 20%;
                }
                .div1-1 > div:nth-child(3){
                    flex: 0 0 66%;
                }
                .div1-1 > div:nth-child(4){
                    flex: 0 0 23%;
                }
                .div1-1 > div:nth-child(5){
                    flex: 0 0 26%;
                }
                .div1-1 > div:nth-child(6){
                    flex: 0 0 26%;
                }
                .div1-1 > div:nth-child(7){
                    flex: 0 0 19%;
                }
            }
            @media screen and (min-width:801px){
                .div1-1{
                    height: 60px;
                }
            }
        </style>
