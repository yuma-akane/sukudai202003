<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="big-5">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
        <script src="../dist/js/jquery.min.js"></script>
        <script src="js/mo.js"></script>
        <link rel="shortcut icon" type="image/png" href="../images/favicon.png">
        <title>生產日報表</title>
        <style>
            h2{text-align: center;}
            h3, h4{font-weight: bold;}
            .form{
                margin: 10% auto 10% auto;
                max-width: 60%;
            }
            .form-row{
                display: flex;
                flex: 1 1 300px;
                box-sizing: border-box;
                padding: 5px;
                gap: 5px;
                border-bottom: 1px solid black;
            }
            .no-border{
                border-bottom: none;
            }
            .div1, .div2, .div3, .div4, .div5, .div6 .div7{
                display: flex;
                flex-wrap: wrap;
            }
            .div7{
                flex-direction: column;
                flex-wrap: nowrap;
            }
            .form-row-h4{
                flex: 0 0 100%;
                padding: 5px;
                gap: 5px;
                background-color: rgb(200, 200, 200);
            }
            .form-label{
                display: flex;
                width: 180px;
                font-weight:bold;
                flex-shrink: 0;
            }
            .form-input{
                flex: 1 1 auto;
                min-width: 0;
            }
            .form-input input{
                flex:  0 1 auto;
                min-width: 0;
                box-sizing: border-box;
            }
            .form-group{
                display: flex;
                flex: 0 1 auto;
                gap: 8px;
                min-width: 0;
                align-items: center;
            }
            .form-group input:last-child(){
                display: none;
                flex: 0 1 auto;
                min-width: 0;
            }
            input:not([name="m01_03_inv"]), select{
                max-width: 140px !important;
            }
            input[name="m01_03_inv"]{
                min-width: 350px !important;
            }
            select, input[type="date"]{
                max-height: 30px !important;
            }
            input[type="date"]{
                width: 100px;
            }
            #time1, #time2, #time3{
                flex-wrap: nowrap;
            }
            .time1{
                width: 25px;
            }
            .time2{
                width: 35px;
            }
            .label1 span{
                font-size: 11px;
                position: relative;
                top: 3px;
            }
            .label2{
                flex-direction: column;
            }
            .label2 span{
                font-size: 11px;
            }
            .label3{
                width: 56px;
            }
            .label4{
                color: red;
            }
            .checkbox-div{
                white-space: nowrap;
            }
            .textarea7-1{
                width: 475px;
                resize: vertical;
                white-space: pre-wrap;
                overflow-wrap: break-word;
                overflow: hidden;
            }
            input[type="number"] {
                appearance: textfield;
                -moz-appearance: textfield;
            }
            input[type="number"]::-webkit-inner-spin-button,
            input[type="number"]::-webkit-outer-spin-button {
                -webkit-appearance: none;
                margin: 0;
            }

            @media screen and (max-width:767px){
                .form{
                    max-width: 98%;
                }
                .form-row{
                    flex-direction:column;
                }
                .form-row > *{
                    align-items: flex-start;
                }
                .form-group{
                    flex-direction: row;
                }
            }
            @media screen and (min-width:768px) and (max-width:991px) {
                .form{
                    max-width: 90%;
                }
            }
            @media screen and (min-width:992px) and (max-width:1199px) {
                .form{
                    max-width: 70%;
                }
            }
        </style>
    </head>
    <body>
        <form class="form" id="myform" method="post">
            <input type="hidden" name="btn" id="btn_sel">
            <h3>褙膠(燙金膠&壓克力膠)</h3>
            <div class="div1">
            <div class="form-row">
                <label class="form-label">生產日期(年/月/日):</label>

            </div>
            <div class="form-row">

            </div>
            <div class="form-row">

                    <input type="date" name="m08-08">
                    <div class="form-input" id="time1">

                        <input type="number" class="time1" name="m08-smm" min="0" max="99" placeholder="分" value="0">

            </div>

        <script>
            /*預設日期為當天*/
            document.querySelector(".today").valueAsDate = new Date();
            /*判斷select是否選擇其他*/
            document.querySelectorAll(".form-group").forEach(function(x) {
                var chk = x.querySelectorAll("select");
                var text = x.querySelector(".select-input");
                function readonlychange(){
                    var y = x.querySelector("select option:checked");
                    if (y && text) {
                        if (y.value === "其他") {
                            text.readOnly = false;
                        } else {
                            text.readOnly = true;
                            text.value = "";
                        }
                    }
                }
                chk.forEach(function(z){
                    z.addEventListener("change", readonlychange);
                });
                readonlychange();
            });
            var chkbox = document.querySelector("input[id='checkbox3-6']");
            chkbox.addEventListener("change", () => {
                var input = chkbox.parentElement.querySelector("input[class='checkbox-input']");
                input.readOnly = !chkbox.checked;
                if(!chkbox.checked){
                    input.value = "";
                }
            });

            /*判斷每個段落最下面一列沒有底線*/
            function border_bottom(){
                document.querySelectorAll(".div1, .div2, .div3, .div4, .div5, .div6, .div7").forEach(y => {
                    var z = y.querySelectorAll(".form-row");

                    z.forEach(a => a.classList.remove("no-border"));

                    var maxtop = Math.max(...Array.from(z).map(a => a.offsetTop));

                    z.forEach(a => {
                        if (a.offsetTop == maxtop) {
                            a.classList.add("no-border");
                        } else if (Math.abs(a.offsetTop - maxtop) <= 2) {
                            a.classList.add("no-border");
                        }
                    });
                });
            }
            function changewidth(){
                var y = document.querySelector(".div6 .no-border")
                var z = y.querySelectorAll(".form-group input");
                var form = document.getElementById("myform").getBoundingClientRect().width;
                var total = 0;

                z.forEach(a => {
                    if(window.matchMedia("(max-width: 767px)").matches){
                        a.style.width = (form - 20) / 4 + "px";
                    } else {
                        a.style.width = (form - 200) / 4 + "px";
                    }
                });
            }
            /*網頁載入完成後執行一次*/
            border_bottom();
            changewidth();

            /*使用者改變視窗大小時執行*/
            window.addEventListener("resize", border_bottom);
            window.addEventListener("resize", changewidth);
            /*判斷數字欄位不可輸入e E*/
            document.addEventListener('keydown', function(event){
                if (event.target.matches('input[type="number"]') &&
                    (event.key === "e" || event.key === "E")
                ){
                    event.preventDefault();
                }
            });
            /*判斷輸入的數字是否超過範圍*/
            document.addEventListener('input', function(event){
                if(!event.target.matches('input[type="number"]')){
                    return;
                }

                var a = event.target;
                if(a.value === ""){
                    a.value = 0;
                    return;
                }
                var x = Number(a.value);
                if(a.min !== "" && x < Number(a.min)){
                    a.value = a.min;
                }
                if(a.max !== "" && x > Number(a.max)){
                    a.value = a.max;
                }
            });
            /*新增機台下拉選項*/
            function createSelect(){
                var txt="";
                for(var i=0;i<mach_list.length;i++){
                    txt += '<option value="' + mach_list[i].mach_code + '">' + mach_list[i].mach_name + '</option>'
                }
                document.getElementById("select1-1").innerHTML = txt;
            }
            createSelect();
            /*判斷備註每行60字元，且最多5行*/
            var textarea = document.getElementById("textarea7-1");
            var MAX_BYTES = 60;
            var MAX_LINES = 5;
            var isComposing = false;
            //計算字元長度，中文和部分特殊符號2字元，其他1字元
            function getBig5ByteLength(char){
                var code = char.codePointAt(0);

                if(code <= 0x7F) {
                    return 1;
                }
                return 2;
            }
            //計算一整行的Byte數
            function getLineByteLength(line){
                var length = 0;
                for(var char of line){
                    length += getBig5ByteLength(char);
                }
                return length;
            }
            //避免每行超過60，避免超過5行
            function formatText(text){
                var lines = text.split(/\r?\n/);
                var result = [];
                for(var line of lines){
                    var currentLine = "";
                    var currentLendth = 0;
                    for(var char of line){
                        var charLength = getBig5ByteLength(char);
                        if(currentLendth + charLength > MAX_BYTES){
                            result.push(currentLine);
                            currentLine = char;
                            currentLendth = charLength;
                            if(result.length >= MAX_LINES){
                                return result.join("\n");
                            }
                        }else{
                            currentLine += char;
                            currentLendth += charLength;
                        }
                    }
                    result.push(currentLine);
                    if(result.length >= MAX_LINES){
                        break;
                    }
                }
                return result.slice(0, MAX_LINES).join("\n");
            }
            //中文輸入法組字中
            textarea.addEventListener("compositionstart", function(){
                isComposing = true;
            });
            //中文輸入法組字完成
            textarea.addEventListener("compositionend", function(){
                isComposing = false;
                formatTextarea();
            })
            //使用者輸入文字，在中文輸入法組字完成前不處理
            textarea.addEventListener("input", function(){
                if(isComposing){
                    return;
                }
                formatTextarea();
            });
            //格式化 textarea
            function formatTextarea(){
                var oldValue = textarea.value;
                var oldCursor = textarea.selectionStart;
                var beforeCursor = oldValue.substring(0,oldCursor);
                var newValue = formatText(oldValue);
                var newBeforeCursor = formatText(beforeCursor);

                if(oldValue !== newValue){
                    textarea.value = newValue;
                    var newCursor = Math.min(
                        newBeforeCursor.length,
                        newValue.length
                    )
                    textarea.setSelectionRange(newCursor,newCursor);
                }
            }
            //判斷使用者貼上文字
            textarea.addEventListener("paste", function(){
                setTimeout(function(){
                    formatTextarea();
                }, 0);
            });

            /*別的頁面開啟時的防呆*/
            var needConfirm=false;
            function canCloseIframe(){
                return needConfirm;
            }
            window.addEventListener('beforeunload', function(event){
                if(needConfirm || !window.parent.isFormModify()){
                    return;
                }
                event.preventDefault();
                event.returnValue="";
            })
            /*點擊送出*/
            function askForSubmit(btn) {
                needConfirm=true;
                window.parent.postMessage(
                    {
                        type: "click",
                        button: "confirm"
                    }
                )
            }
        </script>

        <script>
            document.addEventListener('input', function(event) {
                // 只處理指定的數值欄位
                if (!event.target.matches('.decimal-input')) {
                    return;
                }

                var a = event.target;
                var value = a.value;
            
                // 只允許數字與小數點
                value = value.replace(/[^\d.]/g, '');

                // 找第一個小數點
                var dotIndex = value.indexOf('.');

                if (dotIndex !== -1) {

                    // 整數部分
                    var integerPart = value.substring(0, dotIndex);

                    // 小數部分
                    var decimalPart = value.substring(dotIndex + 1);

                    // 整數最多 8 位
                    integerPart = integerPart.substring(0, 8);

                    // 小數最多 2 位
                    decimalPart = decimalPart.substring(0, 2);

                    // 組合回去
                    value = integerPart + '.' + decimalPart;
                } else {
                    // 沒有小數點時，整數最多 8 位
                    value = value.substring(0, 8);
                }
                
                // 檢查是否超過最大值
                var numberValue = Number(value);

                if (!isNaN(numberValue) && numberValue > 99999999.99) {
                    value = '99999999.99';
                }

                a.value = value;
            });

            // 離開欄位時，自動補足 2 位小數
            document.addEventListener('blur', function(event) {
                if (!event.target.matches('.decimal-input')) {
                    return;
                }

                var a = event.target;
                
                // 空白就不處理
                if (a.value === '') {
                    return;
                }

                var x = Number(a.value);

                if (!isNaN(x)) {
                    // 限制最大值
                    if (x > 99999999.99) {
                        x = 99999999.99;
                    }

                    // 固定顯示 2 位小數
                    a.value = x.toFixed(2);
                }
            }, true);
        </script>
    </body>
