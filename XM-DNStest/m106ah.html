<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="big-5">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
        <script src="../dist/js/jquery.min.js"></script>
        <link rel="shortcut icon" type="image/png" href="../images/favicon.png">
        <title>製程</title>
        <style>
            .center{
                text-align: center;
            }
            .right{
                text-align: right;
            }
            .m_form{
                display: flex;
                flex-direction: column;
                height: 100vh;
            }
            .div1{
                width: 100%;
                flex: 0 0 auto;
            }
            .div1-1{
                display: flex;
                align-items: center;
                gap: 10px;
                border-bottom: 1px solid black;
            }
            .div1-1:first-child{
                background-color: rgb(200,200,200);
            }
            .div1-1:last-child{
                border: none;
            }
            .div1-1:not(:first-child):hover{
                background-color: aquamarine;
            }
            .div-click:not(:last-child){
                background-color: aquamarine;
            }
            .div1-1 > div:first-child{
                flex: 1;
                min-width: 32px;
            }
            .div1-1 > div:nth-child(2),
            .div1-1 > div:nth-child(7){
                flex: 2;
                min-width: 80px;
            }
            .div1-1 > div:nth-child(3){
                flex: 5;
                min-width: 220px;
            }
            .div1-1 > div:nth-child(4){
                flex: 3;
                min-width: 95px;
            }
            .div1-1 > div:nth-child(5),
            .div1-1 > div:nth-child(6){
                flex: 4;
                min-width: 110px;
            }
            .div2{
                flex: 1;
                overflow: hidden;
            }
            .div2 iframe{
                width: 100%;
                height: 100%;
                display: block;
            }
            .last{
                position: relative;
            }
            .box span{
                font-size: 20px;
                height: 100%;
                width: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            #flex{
                display: none;
            }
            .modal{
                display: none; /* 預設隱藏 */
                position: fixed; /* 固定位置 */
                z-index: 1000; /* 確保在最頂層 */
                padding-top: 80px;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                overflow: auto;
                background-color: rgba(0, 0, 0, 0.5); /* 黑色半透明背景 */
            }
            .modal-content{
                margin: auto;
                display: block;
                width: 80%;
                max-width: 900px;
                background-color: white;
                border-radius: 5px;
                padding: 5px;
            }
            .close{
                float: right;
                font-size: 40px;
            }
            .close:hover{
                cursor: pointer;
                color: green;
            }
            .sel_div{
                background-color: #6082B6;
                color: white;
                padding: 5px;
            }
            .modal-content input, .modal-content label{
                display: flex;
                align-items: center;
            }
            @media screen and (max-width:800px){
                .div1-1{
                    flex-wrap: wrap;
                }
                .div1-1 > div{
                    flex: none;
                    min-width: none;
                    box-sizing: border-box;
                    text-align: center;
                }
                .div1-1 > div:nth-child(1){
                    flex: 0 0 10%;
                }
                .div1-1 > div:nth-child(2){
                    flex: 0 0 20%;
                }
                .div1-1 > div:nth-child(3){
                    flex: 0 0 66%;
                }
                .div1-1 > div:nth-child(4){
                    flex: 0 0 23%;
                }
                .div1-1 > div:nth-child(5){
                    flex: 0 0 26%;
                }
                .div1-1 > div:nth-child(6){
                    flex: 0 0 26%;
                }
                .div1-1 > div:nth-child(7){
                    flex: 0 0 19%;
                }
            }
            @media screen and (min-width:801px) and (max-width:991px) {
                .div1-1{
                    height: 60px;
                }
            }
            @media screen and (min-width:992px) and (max-width:1199px) {
                .div1-1{
                    height: 60px;
                }
            }
        </style>
    </head>
    <body>
        <input type="hidden" id="m_no" value="%%a-moc017-01%%">
        <input type="hidden" id="m_user_name" value="%%a-pwd03-name%%">
        <input type="hidden" id="m01_03_inv" value="%%a-inv01-02%%">
        <input type="hidden" id="alldata1" value = "%%a-moc017-04-string%%">
        <input type="hidden" id="alldata2" value = "%%a-moc017-05-string%%">
        <input type="hidden" id="alldata3" value = "%%a-doc02-03-string%%">
        <input type="hidden" id="alldata4" value = "%%a-moc017-07-string%%">
        <input type="hidden" id="alldata5" value = "%%a-moc017-08-string%%">
        <input type="hidden" id="alldata6" value = "%%a-moc017-09-string%%">
        <input type="hidden" id="alldata7" value = "%%a-doc02-03-1-string%%">
        <input type="hidden" id="alldata8" value = "%%a-amt-string%%">
        <form id="m_form" class="m_form">
            <div id="div1" class="div1"></div>
            <div id="div2" class="div2"></div>
        </form>
        <div id="modal_0010" class="modal">
            <div class="modal_content">
                <span class="close" id="close">x</span>
                <center style="background-color: white;height: 45px;">
                    <input type="radio" id="radio1_one" name="radio1" value="熱熔膠">
                    <label for="radio1_one">熱熔膠</label>
                    <input type="radio" id="radio1_two" name="radio1" value="燙金膠&壓克力膠">
                    <label for="radio1_two">燙金膠&壓克力膠</label>
                </center>
                <div id="sel" class="sel_div">
                    <center>
                        <button id="btn_ok" style="color: black;">確定</button>
                        &nbsp;
                        <button id="btn_cancel" style="color: black;">取消</button>
                    </center>
                </div>
            </div>
        </div>
        <script>
            /*製程資料*/
            var data1 = document.getElementById("alldata1").value.split(",");
            var data2 = document.getElementById("alldata2").value.split(",");
            var data3 = document.getElementById("alldata3").value.split(",");
            var data4 = document.getElementById("alldata4").value.split(",");
            var data5 = document.getElementById("alldata5").value.split(",");
            var data6 = document.getElementById("alldata6").value.split(",");
            var data7 = document.getElementById("alldata7").value.split(",");
            var data8 = document.getElementById("alldata8").value.split(",");
            function addtable(){
                var div1_html = '<div class="div1-1 center"><div>序號</div><div>製程編號</div><div>製程名稱</div><div>製造批數</div><div>製費單價</div>'
                              + '<div>製造費用</div><div class="last">製造部門</div></div>';
                for(var i=0;i<data1.length;i++){

                        div1_html += '<div class="div1-1" onclick="gohtml(' + "'" + i + "', this)" + '"><div class="right">' + Number(data1[i]) + '</div>'
                                   + '<div>' + data2[i] + '</div>'
                                   + '<div>' + data3[i] + '</div>'
                                   + '<div class="right">' + (Number(data4[i]) / 100).toFixed(2) + '</div>'
                                   + '<div class="right">' + (Number(data5[i]) / 10000).toFixed(4) + '</div>'
                                   + '<div class="right">' + (Number(data6[i]) / 10000).toFixed(4) + '</div>'
                                   + '<div>' + data7[i] + '</div></div>';
                }
                div1_html += '<div class="div1-1 center box"><span id="none" onclick="display_none()">&#9650;</span>'
                              + '<span id="flex" onclick="display_flex()">&#9660;</span></div>';
                document.getElementById("div1").innerHTML = div1_html;
            }
            addtable();

            /*點擊製程後用iframe開啟相應製程的生產日報表*/
            var iframe;
            var form;
            var oldFormData;
            var num;
            var x = null;
            var div2_html;
            async function gohtml(a, div){
                iframe = document.getElementById("myFrame");
                if(iframe){
                    if(isFormModify() && !iframe.contentWindow.canCloseIframe()){
                        var result = confirm('系統不會儲存你所做的變更。');
                        if(!result){
                            return;
                        }
                    }
                }

                $('div.div1-1').removeClass('div-click');
                div.classList.add('div-click');
                for(var i=1;i<div_chk.length - 1;i++){
                    if(!div_chk[i].classList.contains("div-click")){
                        div_chk[i].style.display = "none";
                    }
                }
                document.getElementById("none").style.display="none";
                document.getElementById("flex").style.display="flex";

                div2_html = "../t" + data2[a] + ".html";
                if(data2[a] === "0009"){
                    div2_html = "../m106.html";
                }
                if(data2[a] === "0010"){
                    await choice("0010");
                }
                if (x===null&&data2[a]==="0010"){
                    document.getElementById("div2").replaceChildren();
                    return;
                }
                num = "t" + data2[a];
                if(data2[a]==="0010"){
                    if(x.id==="radio1_one"){
                        num = "t" + data2[a] + "a";
                    }else{
                        num = "t" + data2[a] + "b";
                    }
                }
                fetch(div2_html, {method:"HEAD"}).then(response => {
                    if(!response.ok){
                        document.getElementById("div2").replaceChildren();
                        return;
                    }
                    var iframe_name = document.createElement("iframe");
                    iframe_name.id = "myFrame";
                    iframe_name.src = div2_html;
                    document.getElementById("div2").replaceChildren();
                    document.getElementById("div2").appendChild(iframe_name);
                    iframe_name.onload = function(){
                        iframe_name.contentDocument.getElementById("m_no").value = document.getElementById("m_no").value;
                        iframe_name.contentDocument.getElementById("m_user_name").value = document.getElementById("m_user_name").value;
                        iframe_name.contentDocument.getElementById("m01_03_inv").value = document.getElementById("m01_03_inv").value;
                        iframe_name.contentDocument.getElementById("m08_18_amt").value = Number(data8[a]/100).toFixed(2);
                        iframe = document.getElementById("myFrame");
                        oldFormData = null;
                        form = iframe.contentDocument.querySelector('form');
                        oldFormData = getFormData(form);
                    }
                })
            }
            /*點擊展開和收回製程欄位*/
            var div_chk = document.querySelectorAll("#div1 > div");
            function display_none(){
                for(var i=1;i<div_chk.length - 1;i++){
                    if(!div_chk[i].classList.contains("div-click")){
                        div_chk[i].style.display = "none";
                    }
                }
                document.getElementById("none").style.display="none";
                document.getElementById("flex").style.display="flex";
            }
            function display_flex(){
                for(var i=0;i<div_chk.length - 1;i++){
                    div_chk[i].style.display = "flex";
                }
                document.getElementById("none").style.display="flex";
                document.getElementById("flex").style.display="none";
            }
            /*點擊褙膠製程時讓使用者選擇開啟褙膠-熱熔膠或是褙膠-燙金膠&壓克力*/
            async function choice(a){
                open_modal(a);
                var chk_modal = await close_modal();
                if(chk_modal === "N"){
                    return;
                }
                x = document.querySelector('input[name="radio1"]:checked');
                if(x===null){
                    return;
                }
                if(x.value==="熱熔膠"){
                    div2_html = "../t" + a + "a.html";
                }else{
                    div2_html = "../t" + a + "b.html";
                }
            }
            function open_modal(a){
                if(a==="0010"){
                    if(x !== null){
                        document.querySelectorAll('input[name=radio1]').forEach(function(radio){
                            radio.checked =false;
                        });
                    }
                    document.getElementById("modal_0010").style.display="block";
                }
            }
            function close_modal(){
                return new Promise(resolve => {
                    document.getElementById("btn_ok").onclick = function() {
                        document.getElementById("modal_0010").style.display="none";
                        resolve("Y");
                    }
                    document.getElementById("btn_cancel").onclick = function(){
                        document.getElementById("modal_0010").style.display="none";
                        resolve("N");
                    }
                    document.getElementById("close").onclick = function(){
                        document.getElementById("modal_0010").style.display="none";
                        resolve("N");
                    }
                });
            }
        </script>
        <script>
            /*將點擊送出按鈕的資料放進變數*/
            function getFormData(form){
                var data={};

                new FormData(form).forEach((value, key) => {
                    if(data[key] !== undefined){
                        if(!Array.isArray(data[key])){
                            data[key] = [data[key]];
                        }
                        data[key].push(value);
                    }else{
                        data[key]=value;
                    }
                });
                return data;
            }
            /*判斷生產日報表資料是否有修改*/
            function isFormModify(){
                if(!form||!oldFormData){
                    return false;
                }
                var currentDara = getFormData(form);
                return JSON.stringify(oldFormData)!==JSON.stringify(currentDara);
            }
            /*判斷iframe內點擊送出按鈕後執行getFormData將整理後的資料放進變數*/
            window.addEventListener("message", function(event){
                if (event.data.type === "click"){
                    window[num] = getFormData(form);
                }
            });
            /*將目前顯示的製程新增對應的變數*/
            function newvar(){
                for(var i;i<data1.length;i++){
                    if(data2[i]==="0010"){
                        globalThis["t" + data2[i] + "a"] = {};
                        globalThis["t" + data2[i] + "b"] = {};
                    }else{
                        globalThis["t" + data2[i]] = {};
                    }
                }
            }
            newvar();
        </script>
    </body>
</html>
