<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="big-5">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
        <script src="../dist/js/jquery.min.js"></script>
        <script src="js/mo.js"></script>
        <script src="js/mo_user.js"></script>
        <link rel="shortcut icon" type="image/png" href="../images/favicon.png">
        <title>生產日報表</title>
        <style>
            body{
                font-family: Arial, Helvetica, sans-serif;
                background-color: #003553;
                padding: 5px;
            }
            .modal{
                display: none; /* 預設隱藏 */
                position: fixed; /* 固定位置 */
                z-index: 1000; /* 確保在最頂層 */
                padding-top: 80px;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                overflow: auto;
                background-color: rgba(0, 0, 0, 0.5); /* 黑色半透明背景 */
            }
            .modal-content{
                margin: auto;
                display: block;
                width: 80%;
                max-width: 900px;
                background-color: white;
                border-radius: 5px;
                padding: 5px;
            }
            .close{
                float: right;
                font-size: 40px;
            }
            .close:hover{
                cursor: pointer;
                color: green;
            }
            .scrollable-table{
                width: 100%;
                border-collapse: collapse;
            }
            .scrollable-table th, .scrollable-table td{
                padding: 10px;
                border: 1px solid #ccc;
            }
            .scrollable-table td{
                color: black;
                padding: 6px;
            }
            .scrollable-table thead th{
                position: sticky;
                top: 0;
                background-color: #e0dfdf;
                z-index: 2; /* 確保在滾動時保持在最上層 */
            }
            .scrollable-div{
                width: 100%;
                height: 150px;
                overflow: auto;
                position: relative;
            }
            .sel_div{
                background-color: #6082B6;
                color: white;
                padding: 5px;
            }
            .search_txt{
                width: 60%;
                margin: 5px 10px 10px 5px;
            }
            .search_btn{
                border-radius: 5px;
                font-size: 18px;
                border: rgb(209, 209, 209) 1.5px solid;
                background-color: rgb(231, 231, 231);
            }
            .tr_click{
                background-color: #6082b6;
            }
            .tr_click td{
                color: white;
            }
            button{
                margin-left: 5px;
            }
            h6,h3,p{margin: 0;color: white;}
            .card>div{display: flex;flex-wrap: wrap;align-items: end;margin: .5rem;}
            .card{position: fixed;width: 100%;top: 0;left: 0;background-color: #d9ff71;}
            .card>div>div>h4, .card>div>div>p, .modal-content>h3{color: black;}
            .scrollable-table th:nth-child(1),
            .scrollable-table td:nth-child(1){
                min-width: 80px;
            }
            .scrollable-table th:nth-child(2),
            .scrollable-table td:nth-child(2){
                min-width: 30px;
            }
            .scrollable-table th:nth-child(3),
            .scrollable-table td:nth-child(3){
                min-width: 70px;
            }
            .scrollable-table th:nth-child(4),
            .scrollable-table td:nth-child(4){
                min-width: 85px;
            }
            .scrollable-table th:nth-child(5),
            .scrollable-table td:nth-child(5){
                min-width: 85px;
            }
            .scrollable-table th:nth-child(6),
            .scrollable-table td:nth-child(6){
                min-width: 180px;
            }
            .scrollable-table th:nth-child(7),
            .scrollable-table td:nth-child(7){
                min-width: 340px;
            }
            .m_no1 button, .m_user button{
                width: 80px;
                height: 40px;
            }
            .card input{
                height: 30px;
            }
            .card>div>div{display: flex;}
            h4{
                white-space: nowrap;
            }
            .card>div>div>input:first-of-type{
                width: 100px;
            }
        </style>
    </head>
    <body>
        <form id="myForm" action method="post" target="hidden_iframe">
            <input type="hidden" name="userid" id="userid">
            <input type="hidden" name="m_no" id="m_no">
            <div class="card open" data-has style="display: block;">
                <div>
                    <div class="m_no1">
                        <h4>製單編號</h4>
                        <input disabled type="text" id="m_no1" name="m_no1">
                        <button type="button" onclick="modal_open()">製單查詢</button>
                    </div>
                    <div class="m_unit">
                        <h4>生產單位</h4>
                        <input disabled type="text" id="m_unit">
                        <input disabled type="text" id="m_unit_doc">
                    </div>
                </div>
                <div>
                    <div class="m_user">
                        <h4>製表人員</h4>
                        <input disabled type="text" id="m_user">
                        <button type="button" onclick="modal_open_user()">人員查詢</button>
                    </div>
                    <div>
                        <h4>組別</h4>
                        <select id="m_team_doc"></select>
                    </div>
                </div>
            </div>
        </form>
        <div id="myModal" class="modal">
            <div class="modal-content">
                <h3>
                    製單查詢
                    <span class="close" onclick="close_modal('N')">x</span>
                </h3>
                <input type="search" id="search_txt" class="search_txt" placeholder="輸入製單編號">
                <button id="search_btn" class="search_btn" onclick="search()">&#128269;</button>
                <br>
                <div class="scrollable-div">
                    <table id="mo_table" class="scrollable-table"></table>
                </div>
                <div id="sel_ord" class="sel_div">
                    <center>
                        <button id="mo_btn_ok" style="color: black;" onclick="close_modal('Y')">確定</button>
                        &nbsp;
                        <button id="mo_btn_cancel" style="color: black;" onclick="close_modal('N')">取消</button>
                    </center>
                </div>
            </div>
        </div>
        <div id="myModal_user" class="modal">
            <div class="modal-content">
                <h3>
                    製表人員
                    <span class="close" onclick="close_modal_user('N')">x</span>
                </h3>
                <input type="search" id="search_txt_user" class="search_txt" placeholder="輸入人員代號">
                <button id="search_user_btn" class="search_btn" onclick="search_user()">&#128269;</button>
                <br>
                <div class="scrollable-div">
                    <table id="user_table" class="scrollable-table"></table>
                </div>
                <div id="user_sel_ord" class="sel_div">
                    <center>
                        <button id="user_btn_ok" style="color: black;" onclick="close_modal_user('Y')">確定</button>
                        &nbsp;
                        <button id="user_btn_cancel" style="color: black;" onclick="close_modal_user('N')">取消</button>
                    </center>
                </div>
            </div>
        </div>
        <script>//製單編號
            /*開啟製單搜尋modal*/
            function modal_open(){
                document.getElementById("myModal").style.display = "block";
                document.getElementById('mo_table').innerHTML = '';
                document.getElementById('search_txt').value = '';
                document.getElementById('m_no1').value = '';
                document.getElementById('m_unit').value = '';
                document.getElementById('m_unit_doc').value = '';
                document.getElementById('mo_btn_ok').disabled = '';
            }
            /*關閉modal*/
            function close_modal(val) {
                if (val=="N"){
                    document.getElementById('m_no1').value = '';
                    document.getElementById('m_unit').value = '';
                    document.getElementById('m_unit_doc').value = '';
                }
                if (val=="Y"){
                    document.getElementById("m_no").value = document.getElementById("m_no1").value;
                    if (document.getElementById("m_no").value===""){
                        var table = document.getElementById("mo_table");
                        if (table.querySelector("tbody tr")){
                            search();
                        }
                        return;
                    }
                    document.forms['myForm'].action='cgi/m106a.acu';
                    document.forms['myForm'].submit();
                }
                document.getElementById("myModal").style.display = "none";
            }

            document.getElementById("search_txt").addEventListener("keydown", function(event){
                if(event.key ==="Enter"){
                    search();
                }
            });

            /*顯示製單資料*/
            function search(){
                document.getElementById("m_no").value = "";
                document.getElementById("m_unit").value = "";
                document.getElementById("m_unit_doc").value = "";
                var s_txt = document.getElementById("search_txt").value;
                var table_html = "";
                for(var i=0;i<mo_list.length;i++){
                    if(mo_list[i].m_no.includes(s_txt)==true || s_txt==""){
                        if(table_html==""){
                            table_html = '<thead><tr><th>製單編號</th><th colspan="2">生產單位</th><th>預定開工</th><th>預定完工</th>'
                                       + '<th>料品編號</th><th>品名規格</th></tr></thead><tbody>';
                        }
                        table_html += '<tr class="tr_row" onclick="row_click(this)"><td>' + mo_list[i].m_no
                                    + '</td><td>' + mo_list[i].m_unit       + '</td><td>' + mo_list[i].m_unit_doc
                                    + '</td><td>' + mo_list[i].m_day_s      + '</td><td>' + mo_list[i].m_day_e
                                    + '</td><td>' + mo_list[i].m_item       + '</td><td>' + mo_list[i].m_item_inv
                                    + '</td></tr>';
                    }
                }
                if(table_html==""){
                    table_html = '<font color="red">查無相關製單資料</font>';
                }else{
                    table_html += '</tbody>';
                }
                document.getElementById("mo_table").innerHTML = table_html;
            }

            /*點擊製單資料後，將資料放到form*/
            function row_click(tr){
                document.getElementById("mo_btn_ok").disabled = "";
                $('tr.tr_row').removeClass("tr_click");
                tr.classList.add("tr_click");
                var txt = "";
                document.getElementById("m_no1").value = tr.children[0].textContent;
                document.getElementById("m_unit").value = tr.children[1].textContent;
                document.getElementById("m_unit_doc").value = tr.children[2].textContent;
            }
        </script>
        <script>//製表人員
            /*開啟製表人員搜尋modal*/
            function modal_open_user(){
                document.getElementById("myModal_user").style.display = "block";
                document.getElementById("user_table").innerHTML = '';
                document.getElementById('search_txt_user').value = '';
                document.getElementById("m_user").value="";
                document.getElementById("m_team_doc").value="";
                document.getElementById('user_btn_ok').disabled = '';
            }
            /*關閉modal*/
            function close_modal_user(val) {
                document.getElementById("myModal_user").style.display = "none";
                if (val=="N"){
                    document.getElementById('m_user').value = '';
                    document.getElementById('m_team_doc').innerHTML = '';
                }
                if (val=="Y"){
                    var check = document.getElementById("userid").value;
                    var txt="";
                    for(var i=0;i<team_list.length;i++){
                        if(check === team_list[i].user_id){
                            txt += '<option value="' + team_list[i].user_team + '">' + team_list[i].team_doc + '</option>';
                        }
                    }
                    document.getElementById("m_team_doc").innerHTML = txt;
                }
            }

            document.getElementById("search_txt_user").addEventListener("keydown", function(event){
                if(event.key ==="Enter"){
                    search_user();
                }
            });
            /*顯示製表人員資料*/
            function search_user(){
                document.getElementById("m_user").value = "";
                document.getElementById("m_team_doc").value = "";
                var s_txt = document.getElementById("search_txt_user").value;
                var table_html = "";
                for(var i=0;i<user_list.length;i++){
                    if(user_list[i].user.includes(s_txt)==true||s_txt==""){
                        if(table_html==""){
                            table_html = '<thead><tr><th>人員代號</th><th>人員名稱</th></tr></thead></tbody>';
                        }
                        table_html += '<tr classs="tr_row" onclick="row_click_user(this)"><td>' + user_list[i].user
                                    + '</td><td>' + user_list[i].user_name + '</td></tr>';
                    }
                }
                if(table_html==""){
                    table_html = '<font color="red">查無相關人員資料</font>'
                }else{
                    table_html += '</tbody>'
                }
                document.getElementById("user_table").innerHTML = table_html;
            }
            /*點擊製表人員後，將資料放到form*/
            function row_click_user(tr){
                document.getElementById("user_btn_ok").disabled = "";
                $('tr.tr_row').removeClass("tr_click");
                tr.classList.add("tr_click");
                document.getElementById("m_user").value = tr.children[1].textContent;
                document.getElementById("userid").value= tr.children[0].textContent;
            }
        </script>
    </body>
</html>
